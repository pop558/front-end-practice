<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>常见文本类型</title>
</head>
<body>
    <h1>一级标签</h1>
    <h2>二级标签</h2>
    <p>这是第一个<b>段落标签</b></p>
    <p>这是第二个<s>可爱的</s>段落标签</p>
    <p>这是第三个<u>要读书的</u>段落标签</p>
    <p>这是第一个<i>段落标签</i></p>
    <ul>无序序列1</ul>
    <ul>无序序列2</ul>
    <ul>无序序列3</ul>
    <ol>有序序列1</ol>
    <ol>有序序列2</ol>
    <ol>有序序列3</ol>
    <table border="2">
        <tr><th>第1列</th>
            <th>第2列</th>
            <th>第3列</th>
        </tr>
        <tr><td>第1元素</td>
            <td>第2元素</td>
            <td>第3元素</td>
        </tr>
        <tr><td>第4元素</td>
            <td>第5元素</td>
            <td>第6元素</td>
        </tr>
        <tr><td>第7元素</td>
            <td>第8元素</td>
            <td>第9元素</td>
        </tr>
    </table>
    
</body>
</html>
