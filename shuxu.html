<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

        .zsy {
            background-color: aquamarine;

            height: 100px;;
        }

    <div class="zsy">这是一个块元素</div>

    <img src="zlh.webp" alt="图片加载失败" class="qwr">
    <h2>display</h2>
    <div class="yyds">块元素转行内元素</div>
    <span class="inline-block">行内元素转行内块元素</span>
    <span class="inline-block">行内元素转行内块元素</span>

    
</body>
</html>
