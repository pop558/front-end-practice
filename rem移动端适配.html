<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rem移动端适配</title>
    <style>
        /* html {
            font-size: 20px;
        } */
        .pox-px {
            width: 300px;
            height: 100px;
            background-color: black;
        }
        .pox-rem {
            width: 5rem;
            height: 3rem;
            background-color: bisque;
        } 
    </style>
</head>
<body>
    <html></html>
    <div class="pox-px"></div>
    <div class="pox-rem"></div>
</body>
</html>
<script>
    function resentHTMLfontsize(){
        document.documentElement.style.fontSize=(document.documentElement.clientWidth/10)+'px';
        

    }
    resentHTMLfontsize();
    window.onresize=resentHTMLfontsize;
</script>
