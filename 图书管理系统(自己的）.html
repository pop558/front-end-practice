     /* 外层父容器，让两个表格横向并排不换行 */
.table-box {
  display: flex;
  gap: 30px; /* 两个表格之间的间距 */
}
#table {
  background-color: rgb(201, 223, 229);
  text-align: center;
  padding: 8px;
  margin: 20px;
  border-collapse: collapse;
}
table {
  background-color: rgb(181, 210, 181);
  text-align: left;
  padding: 8px;
  margin: 20px;
  border-collapse: collapse;
  /* 删掉原来table里的display:flex！ */
}
#title2 {
  background-color: lightslategray;
  color: aliceblue;
}
/* 修复font-weight错误，font-weight只能填数字100~900，不能写百分比 */
#table, table {
  font-weight: normal;
}
